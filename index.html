<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amoira Harmony v11.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Nunito', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        textarea { resize: none; }
        .calendar-day { cursor: pointer; transition: all 0.2s; border-radius: 0.5rem; }
        .calendar-day.active { background-color: #4A8B82; color: white; font-weight: bold; }
        .calendar-day.has-data::after { content: ''; display: block; width: 4px; height: 4px; background-color: #A14740; border-radius: 50%; margin: 2px auto 0; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-gray-800 h-screen overflow-hidden flex flex-col relative">

    <header class="bg-white px-6 py-5 shadow-sm flex justify-between items-center shrink-0 z-10 rounded-b-3xl">
        <h1 class="text-xl font-extrabold text-[#3B7A72] tracking-wide"><i class="fa-solid fa-leaf mr-2 text-[#A14740]"></i>Harmony v11.1</h1>
        <div class="flex items-center bg-[#E5F2F0] px-3 py-1 rounded-full border border-[#BDE0DB]">
            <div id="sync-dot" class="w-2 h-2 rounded-full bg-[#3B7A72] animate-pulse mr-2"></div>
            <span id="sync-text" class="text-[10px] font-bold text-[#3B7A72] uppercase tracking-wider">Menghubungkan...</span>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 py-6 pb-28 relative hide-scrollbar">
        
        <!-- TAB 1: OMNIBOX AI -->
        <section id="tab-omnibox" class="block space-y-6">
            <div class="bg-gradient-to-br from-[#3B7A72] to-[#4A8B82] rounded-3xl p-6 shadow-lg shadow-[#4A8B82]/20 relative overflow-hidden text-white mt-2">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                <h2 class="text-2xl font-extrabold mb-1">Halo, Amoira!</h2>
                <p class="text-xs font-semibold opacity-90 mb-6">Input banyak transaksi sekaligus? Bisa.</p>
                
                <div class="bg-white/10 p-1 rounded-2xl backdrop-blur-sm border border-white/20">
                    <textarea id="ai-input" rows="4" placeholder="Cth: bensin 40rb kemarin, jajan kopi 20rb hari ini..." class="w-full bg-white text-gray-800 rounded-xl p-4 text-sm font-bold outline-none placeholder-gray-400"></textarea>
                    <button id="btn-process-ai" onclick="window.processAI()" class="w-full mt-2 py-3.5 bg-white text-[#3B7A72] rounded-xl text-sm font-extrabold shadow-sm hover:bg-[#E5F2F0] transition">
                        <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Analisa Semua
                    </button>
                </div>
            </div>

            <div id="ai-result-container" class="hidden space-y-3"></div>
        </section>

        <!-- TAB 2 & 3 (Sama seperti v11, tapi disederhanakan untuk eksekusi) -->
        <section id="tab-dashboard" class="hidden space-y-6">
            <!-- Isi Hero Card, Donut, & Transaksi tetap sama -->
            <div id="dashboard-content">Buka Dashboard untuk Audit...</div>
        </section>
        
        <section id="tab-draft" class="hidden">
            <div id="planning-content">Tab Planning...</div>
        </section>

    </main>

    <button id="fab-manual-input" onclick="openSpendingModal()" class="hidden absolute bottom-24 right-6 w-14 h-14 bg-[#D17B74] text-white rounded-full shadow-lg flex items-center justify-center text-2xl z-20 border-2 border-white">
        <i class="fa-solid fa-plus"></i>
    </button>

    <nav class="bg-white px-4 py-4 shadow-md absolute bottom-0 w-full flex justify-between z-10 rounded-t-3xl border-t">
        <button onclick="switchTab('omnibox')" id="nav-omnibox" class="flex flex-col items-center flex-1 text-[#4A8B82]"><i class="fa-solid fa-wand-magic-sparkles text-2xl mb-1"></i><span class="text-[9px] font-extrabold">INPUT AI</span></button>
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center flex-1 text-gray-400"><i class="fa-solid fa-layer-group text-2xl mb-1"></i><span class="text-[9px] font-extrabold">DASHBOARD</span></button>
        <button onclick="switchTab('draft')" id="nav-draft" class="flex flex-col items-center flex-1 text-gray-400"><i class="fa-solid fa-compass-drafting text-2xl mb-1"></i><span class="text-[9px] font-extrabold">PLANNING</span></button>
    </nav>

    <!-- Script Logic V11.1 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        // CONFIG (Ganti dengan URL GAS BARU jika berubah)
        const GAS_AI_PROXY_URL = "https://script.google.com/macros/s/AKfycbxCLbh3M_QLmjdJHJ8rYaB_iofKDa-GbWIcqAg_Vjvj5cNbQ0jYX7MkaV7VLrXGyose/exec";
        
        const firebaseConfig = { apiKey: "AIzaSyAh0vnMQcvRk0cQ9QdDLDto7eQbxANWYWY", authDomain: "amoira-command-center.firebaseapp.com", projectId: "amoira-command-center", storageBucket: "amoira-command-center.firebasestorage.app", messagingSenderId: "882649755031", appId: "1:882649755031:web:fc58f60fa7b906991268d2" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "cycles", "05-2026");

        let recentSpending = [];
        let currentAIDrafts = [];

        window.processAI = async () => {
            const inputEl = document.getElementById('ai-input');
            const text = inputEl.value.trim();
            if(!text) return;

            const btn = document.getElementById('btn-process-ai');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menganalisa...';
            btn.disabled = true;

            try {
                const todayStr = new Date().toISOString().split('T')[0];
                const res = await fetch(GAS_AI_PROXY_URL, {
                    method: "POST",
                    body: JSON.stringify({text: text, currentDate: todayStr})
                });
                const data = await res.json();
                
                if(Array.isArray(data) && data.length > 0) {
                    currentAIDrafts = data;
                    renderAIDrafts();
                } else {
                    alert("Amoira, AI tidak menemukan transaksi. Coba tulis lebih jelas.");
                }
            } catch(e) {
                alert("Error koneksi ke AI. Cek URL GAS kamu.");
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Analisa Semua';
                btn.disabled = false;
            }
        };

        const renderAIDrafts = () => {
            const container = document.getElementById('ai-result-container');
            container.innerHTML = `<p class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2 mb-2">Hasil Deteksi (${currentAIDrafts.length} Transaksi)</p>`;
            
            currentAIDrafts.forEach((item, index) => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-[#E5F2F0] text-[#3B7A72] flex items-center justify-center text-xs font-bold">${index + 1}</div>
                            <div>
                                <p class="text-xs font-black text-gray-700">${item.desc}</p>
                                <p class="text-[10px] font-bold text-gray-400">${item.date} | ${item.category}</p>
                            </div>
                        </div>
                        <p class="text-sm font-black text-[#A14740]">Rp ${new Intl.NumberFormat('id-ID').format(item.amount)}</p>
                    </div>
                `;
            });

            container.innerHTML += `
                <div class="flex gap-2 mt-4">
                    <button onclick="window.cancelDrafts()" class="flex-1 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold text-xs">Batal</button>
                    <button onclick="window.saveAllDrafts()" class="flex-2 w-2/3 py-3 bg-[#3B7A72] text-white rounded-xl font-bold text-xs shadow-md">Simpan Semua (${currentAIDrafts.length})</button>
                </div>
            `;
            container.classList.remove('hidden');
        };

        window.cancelDrafts = () => {
            currentAIDrafts = [];
            document.getElementById('ai-result-container').classList.add('hidden');
        };

        window.saveAllDrafts = async () => {
            const d = new Date();
            const timeStr = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            
            currentAIDrafts.forEach(item => {
                recentSpending.push({ id: Date.now() + Math.random(), amount: item.amount, cat: item.category, desc: item.desc, date: item.date, time: timeStr });
            });

            await updateDoc(docRef, { recentSpending });
            alert("Berhasil disimpan!");
            inputEl.value = '';
            window.cancelDrafts();
            location.reload(); // Refresh untuk update dashboard
        };

        window.switchTab = (tabName) => {
            ['omnibox', 'dashboard', 'draft'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).classList.replace('text-[#4A8B82]', 'text-gray-400');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.replace('text-gray-400', 'text-[#4A8B82]');
        };

        // Sync awal
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) recentSpending = docSnap.data().recentSpending || [];
        document.getElementById('sync-text').innerText = "Tersinkronisasi";
        document.getElementById('sync-dot').classList.remove('animate-pulse');

    </script>
</body>
</html>
